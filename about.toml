# Configuration for cargo-about, which scripts/notices.sh runs to write NOTICES.md.

# The licenses a dependency may use. When a crate offers a choice, cargo-about picks the
# one that comes first in this list.
accepted = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Apache-2.0",
    "MPL-2.0",
]
# The targets that cinders is released for. Crates that only other platforms use are left
# out.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
# Leave cinders itself out of NOTICES.md, which lists third-party code.
private = { ignore = true }
# Look for license files in the top directory of each crate.
max-depth = 1
